name: bailo-dev

services:
  backend:
    ports:
      - 9229:9229
    volumes:
      - ./backend/src:/app/src
    build:
      target: dev

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules/@next # use container-built @next SWC binaries (musl), not the host's (e.g. glibc)
      - /app/.next # prevent `uncaughtException [Error: EACCES: permission denied, open '.../Bailo/frontend/.next/...']` on `npm run build`
    build:
      target: dev

  mongo:
    ports:
      - 27017:27017

  nginx:
    ports:
      - ${EXTERNAL_PORT}:8080

  seaweedfs:
    ports:
      - 9333:9333
      - 8888:8888

networks:
  debug:
    name: ${INSTANCE_NAME}_debug
