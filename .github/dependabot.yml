version: 2
updates:
  # Root package.json (workspaces orchestrator)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25

  # Frontend
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - next
          - next-router-mock
          - '@next/*'
          - '@mdx-js/*'
          - '@vitejs/plugin-react'
      mui-stack:
        patterns:
          - '@mui/*'
          - '@emotion/*'
          - notistack
      eslint-stack:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - '@typescript-eslint/*'
      testing-stack:
        patterns:
          - vitest
          - '@testing-library/*'
          - cypress
          - cypress-axe
          - axe-core
          - jsdom
      rjsf-stack:
        patterns:
          - '@rjsf/*'
      markdown-stack:
        patterns:
          - markdown-*
          - remark-*
          - rehype-*
          - '@uiw/react-markdown-preview'
          - '@uiw/react-md-editor'
      types-stack:
        patterns:
          - '@types/*'
      aws-sdk-stack:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'

  # Backend
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      aws-sdk-stack:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
      opentelemetry-stack:
        patterns:
          - '@opentelemetry/*'
      eslint-stack:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - '@typescript-eslint/*'
          - typescript-eslint
      testing-stack:
        patterns:
          - vitest
          - '@vitest/*'
          - '@anatine/zod-mock'
          - supertest
      mongoose-stack:
        patterns:
          - mongoose
          - mongodb
          - connect-mongo
          - '@agendajs/mongo-backend'
          - agenda
      logging-stack:
        patterns:
          - pino
          - pino-*
      express-stack:
        patterns:
          - express
          - express-rate-limit
          - express-session
          - body-parser
          - helmet
      validation-stack:
        patterns:
          - zod
          - zod-error
          - '@asteasolutions/zod-to-openapi'
      types-stack:
        patterns:
          - '@types/*'
      vite-stack:
        patterns:
          - vite
          - vite-tsconfig-paths

  # Landing page
  - package-ecosystem: 'npm'
    directory: '/lib/landing'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - next
          - '@next/*'
          - '@mdx-js/*'
      mui-stack:
        patterns:
          - '@mui/*'
          - '@emotion/*'
          - styled-components
      eslint-stack:
        patterns:
          - eslint
          - eslint-*
      markdown-stack:
        patterns:
          - remark-*
          - rehype-*
      types-stack:
        patterns:
          - '@types/*'

  # Docker images
  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/backend'
      - '/frontend'
      - '/lib/artefactscan_api'
    schedule:
      interval: 'weekly'
    groups:
      node-images:
        patterns:
          - node
      python-images:
        patterns:
          - python

  # Docker Compose
  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'weekly'

  # Helm
  - package-ecosystem: 'helm'
    directories:
      - '/infrastructure/helm/bailo'
    schedule:
      interval: 'weekly'

  # Python (uv) - group all so a common dep (e.g. ruff) has a single PR rather than 1 per dir
  - package-ecosystem: 'uv'
    directories:
      - '/lib/python'
      - '/lib/artefactscan_api'
      - '/backend/docs'
    schedule:
      interval: 'weekly'
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      scanning-stack:
        patterns:
          - modelscan
          - oras
      server-stack:
        patterns:
          - fastapi
          - uvicorn
          - pydantic-settings
          - python-multipart
          - content-size-limit-asgi
      sphinx-stack:
        patterns:
          - sphinx
          - sphinx-*
          - myst-parser
          - nbsphinx
      dev-tooling:
        patterns:
          - pre-commit
          - pytest
          - pytest-*
          - ruff

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 12
    groups:
      github-actions:
        patterns:
          - actions/*
          - github/*
          - docker/*
