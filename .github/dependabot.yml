version: 2
updates:
  # Root package.json (workspaces orchestrator)
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      formatting-stack:
        patterns:
          - prettier
          - lint-staged
          - husky

  # Frontend
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - react-diff-viewer-continued
          - react-to-print
          - next
          - next-router-mock
          - '@next/*'
          - '@mdx-js/*'
          - '@vitejs/plugin-react'
      mui-stack:
        patterns:
          - '@mui/*'
          - '@emotion/*'
          - notistack
      eslint-stack:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - '@typescript-eslint/*'
      testing-stack:
        patterns:
          - vitest
          - '@testing-library/*'
          - cypress
          - cypress-axe
          - axe-core
          - jsdom
      rjsf-stack:
        patterns:
          - '@rjsf/*'
      markdown-stack:
        patterns:
          - markdown-*
          - remark-*
          - rehype-*
          - '@uiw/react-markdown-preview'
          - '@uiw/react-md-editor'
      types-stack:
        patterns:
          - '@types/*'
      typescript-stack:
        patterns:
          - typescript
      utility-stack:
        patterns:
          - lodash-es
          - semver
          - uuid
          - clsx
          - dayjs
          - pretty-bytes
          - randomcolor
          - http-status-codes
          - is-docker
          - js-cookie
          - jsonschema
          - sharp
      data-fetching-stack:
        patterns:
          - swr
          - axios
      swc-optional-stack:
        patterns:
          - '@next/swc-*'
      telemetry-stack:
        patterns:
          - '@vercel/otel'
      formatting-stack:
        patterns:
          - prettier
          - '@fontsource/*'

  # Backend
  - package-ecosystem: 'npm'
    directory: '/backend'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      aws-sdk-stack:
        patterns:
          - '@aws-sdk/*'
          - '@smithy/*'
      opentelemetry-stack:
        patterns:
          - '@opentelemetry/*'
      eslint-stack:
        patterns:
          - eslint
          - eslint-*
          - '@eslint/*'
          - '@typescript-eslint/*'
          - typescript-eslint
      testing-stack:
        patterns:
          - vitest
          - '@vitest/*'
          - '@anatine/zod-mock'
          - supertest
      mongoose-stack:
        patterns:
          - mongoose
          - mongodb
          - connect-mongo
          - '@agendajs/mongo-backend'
          - agenda
      logging-stack:
        patterns:
          - pino
          - pino-*
          - morgan
      typescript-stack:
        patterns:
          - typescript
          - tsx
          - vite
          - vite-tsconfig-paths
      types-stack:
        patterns:
          - '@types/*'
      express-stack:
        patterns:
          - express
          - express-rate-limit
          - express-session
          - body-parser
          - helmet
          - swagger-ui-express
      email-stack:
        patterns:
          - mjml
          - nodemailer
          - handlebars
      validation-stack:
        patterns:
          - zod
          - zod-error
          - '@asteasolutions/zod-to-openapi'
          - jsonschema
          - json-schema-traverse
      utility-stack:
        patterns:
          - lodash-es
          - semver
          - uuid
          - nanoid
          - bytes
          - chalk
          - dedent-js
          - outdent
          - yargs
          - utility-types
          - p-queue
          - node-cache
          - globals
      auth-stack:
        patterns:
          - grant
          - jsonwebtoken
          - bcryptjs
      file-handling-stack:
        patterns:
          - tar-stream
          - content-disposition
          - form-data
          - sanitize-html
          - showdown
          - xmlbuilder2
      network-stack:
        patterns:
          - node-fetch
          - proxy-agent
          - undici
          - qs
      scanning-stack:
        patterns:
          - clamscan
      misc-stack:
        patterns:
          - app-root-path
          - config
          - dev-null
          - nodemon
          - shelljs
          - '@huggingface/hub'
      formatting-stack:
        patterns:
          - prettier

  # Landing page
  - package-ecosystem: 'npm'
    directory: '/lib/landing'
    schedule:
      interval: 'monthly'
    versioning-strategy: increase
    open-pull-requests-limit: 25
    groups:
      react-stack:
        patterns:
          - react
          - react-dom
          - next
          - '@next/*'
          - '@mdx-js/*'
      mui-stack:
        patterns:
          - '@mui/*'
          - '@emotion/*'
          - styled-components
      eslint-stack:
        patterns:
          - eslint
          - eslint-*
      markdown-stack:
        patterns:
          - remark-*
          - rehype-*
      types-stack:
        patterns:
          - '@types/*'
      utility-stack:
        patterns:
          - dedent-js
          - shelljs
          - swagger-ui-dist
          - swiper
          - typescript

  # Docker images
  - package-ecosystem: 'docker'
    directories:
      - '/'
      - '/backend'
      - '/frontend'
      - '/lib/artefactscan_api'
    schedule:
      interval: 'weekly'
    groups:
      node-images:
        patterns:
          - node
      python-images:
        patterns:
          - python

  # Docker Compose
  - package-ecosystem: 'docker-compose'
    directories:
      - '/'
    schedule:
      interval: 'weekly'

  # Helm
  - package-ecosystem: 'helm'
    directories:
      - '/infrastructure/helm/bailo'
    schedule:
      interval: 'weekly'

  # Python - bailo client library
  - package-ecosystem: 'pip'
    directories:
      - '/lib/python'
    schedule:
      interval: 'weekly'
    versioning-strategy: increase
    open-pull-requests-limit: 10

  # Python - artefactscan API
  - package-ecosystem: 'pip'
    directories:
      - '/lib/artefactscan_api'
    schedule:
      interval: 'weekly'
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      scanning-stack:
        patterns:
          - modelscan
          - modelscan[*]
          - oras
      server-stack:
        patterns:
          - fastapi
          - fastapi[*]
          - uvicorn
          - pydantic_settings
          - python-multipart
          - content-size-limit-asgi
      testing-stack:
        patterns:
          - pytest
          - pytest-*
          - pre_commit

  # Python - backend docs
  - package-ecosystem: 'pip'
    directories:
      - '/backend/docs'
    schedule:
      interval: 'weekly'
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      sphinx-stack:
        patterns:
          - sphinx
          - sphinx-*
          - myst_parser
          - nbsphinx
      dev-tools-stack:
        patterns:
          - pre_commit
          - ipython

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - actions/*
          - github/*
          - docker/*
