name: Build Bailo Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Version tag for backend & frontend (e.g. 2.19.0)'
        required: false
        type: string
      artefactscan_tag:
        description: 'Version tag for artefactscan (e.g. 4.1.0)'
        required: false
        type: string

# jobs define their own required permissions
permissions: {}

jobs:
  build_images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    strategy:
      matrix:
        component:
          - name: backend
            context: backend
            additional_contexts: python=./lib/python
            dockerfile: backend/Dockerfile
            tar: /tmp/bailo_backend.tar
            artifact: bailo_backend
            cache_scope: backend
            tag: bailo_backend:latest,bailo_backend:prod
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
            tar: /tmp/bailo_frontend.tar
            artifact: bailo_frontend
            cache_scope: frontend
            tag: bailo_frontend:latest,bailo_frontend:prod
          - name: artefactscan
            context: lib/artefactscan_api
            dockerfile: lib/artefactscan_api/Dockerfile
            tar: /tmp/bailo_artefactscan.tar
            artifact: bailo_artefactscan
            cache_scope: artefactscan
            tag: bailo_artefactscan:latest,bailo_artefactscan:prod

    steps:
      # Clone repository
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Setup BuildX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.component.name }} image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          build-contexts: ${{ matrix.component.additional_contexts || '' }}
          file: ${{ matrix.component.dockerfile }}
          tags: ${{ matrix.component.tag }}
          cache-from: type=gha,scope=${{ matrix.component.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component.cache_scope }}
          outputs: type=docker,dest=${{ matrix.component.tar }}

      # artefactscan version check (separate to release versions)
      - name: Check if artefactscan_api version changed
        if: github.ref == 'refs/heads/main' && matrix.component.name == 'artefactscan'
        id: artefactscan_version_changed
        run: |
          set -euo pipefail

          # debug logging
          echo "Git context HEAD commit:"
          git --no-pager log -1 --oneline

          git fetch origin main

          PREV_MAIN_COMMIT=$(git rev-list --first-parent origin/main -n 2 | tail -n 1)
          echo "Previous main commit: $PREV_MAIN_COMMIT"

          OLD_VERSION=$(git show "$PREV_MAIN_COMMIT:lib/artefactscan_api/bailo_artefactscan_api/config.py" | grep 'app_version' | head -n1 | cut -d'"' -f2)
          NEW_VERSION=$(grep 'app_version' lib/artefactscan_api/bailo_artefactscan_api/config.py | head -n1 | cut -d'"' -f2)
          echo "OLD_VERSION=$OLD_VERSION"
          echo "NEW_VERSION=$NEW_VERSION"

          if [ "$OLD_VERSION" != "$NEW_VERSION" ]; then
            echo "Result: app_version has changed"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          else
            echo "Result: app_version has NOT changed"
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine push targets
        id: push_targets
        # use env to safely prevent potential shell injection
        env:
          IS_RELEASE: ${{ github.event_name == 'release' }}
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          IS_ARTEFACTSCAN: ${{ matrix.component.name == 'artefactscan' }}
          ARTEFACTSCAN_CHANGED: ${{ steps.artefactscan_version_changed.outputs.changed == 'true' }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTEFACTSCAN_TAG: ${{ inputs.artefactscan_tag }}
        run: |
          PUSH_RELEASE="false"
          if [[ "$IS_ARTEFACTSCAN" == "false" ]]; then
            if [[ "$IS_RELEASE" == "true" || ("$IS_DISPATCH" == "true" && -n "$RELEASE_TAG") ]]; then
              PUSH_RELEASE="true"
            fi
          fi

          PUSH_ARTEFACTSCAN="false"
          if [[ "$IS_ARTEFACTSCAN" == "true" ]]; then
            # ARTEFACTSCAN_CHANGED is empty (not 'true') when the version check step is skipped for non-artefactscan matrix entries
            if [[ ("$IS_MAIN" == "true" && "$ARTEFACTSCAN_CHANGED" == "true") || ("$IS_DISPATCH" == "true" && -n "$ARTEFACTSCAN_TAG") ]]; then
              PUSH_ARTEFACTSCAN="true"
            fi
          fi

          echo "push_release=$PUSH_RELEASE" >> $GITHUB_OUTPUT
          echo "push_artefactscan=$PUSH_ARTEFACTSCAN" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        if: steps.push_targets.outputs.push_release == 'true' || steps.push_targets.outputs.push_artefactscan == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend & frontend images to GHCR
        if: steps.push_targets.outputs.push_release == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          build-contexts: ${{ matrix.component.additional_contexts || '' }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bailo_${{ matrix.component.name }}:${{ github.event.release.tag_name || inputs.release_tag }}
            ghcr.io/${{ github.repository_owner }}/bailo_${{ matrix.component.name }}:latest
          cache-from: type=gha,scope=${{ matrix.component.cache_scope }}

      - name: Push artefactscan image to GHCR
        if: steps.push_targets.outputs.push_artefactscan == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.component.context }}
          build-contexts: ${{ matrix.component.additional_contexts || '' }}
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bailo_${{ matrix.component.name }}:${{ steps.artefactscan_version_changed.outputs.version || inputs.artefactscan_tag }}
            ghcr.io/${{ github.repository_owner }}/bailo_${{ matrix.component.name }}:latest
          cache-from: type=gha,scope=${{ matrix.component.cache_scope }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.component.artifact }}
          path: ${{ matrix.component.tar }}

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        task: [build, unit, style]

    steps:
      # Clone repository
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - name: Cache npm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run build
        if: matrix.task == 'build'
        run: npm run build

      - name: Create certs
        if: matrix.task == 'unit'
        run: sudo chown -R runner:docker backend/certs && npm run certs

      - name: Run unit tests
        if: matrix.task == 'unit'
        run: npm run test

      - name: Run style checks
        if: matrix.task == 'style'
        run: npm run check-style && npm run lint

  kubernetes:
    needs: [build_images]
    runs-on: ubuntu-latest

    steps:
      # Clone repository
      - uses: actions/checkout@v7

      # Setup BuildX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # jq is required so that `npm ci` is not needed to generate certs
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Get Bailo Docker images
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          pattern: bailo_*
          path: /tmp

      - name: List downloaded artifacts
        run: ls -R /tmp/bailo_*

      - name: Start minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          kubernetes-version: v1.35.0
          start-args: |
            --cpus=2
            --memory=4096
            --addons=none

      - name: List Cluster
        run: kubectl get pods -A

      - name: Load docker images into minikube
        run: |
          set -euo pipefail

          eval "$(minikube -p minikube docker-env)"

          # Load all Bailo images downloaded as artifacts
          for image in /tmp/bailo_*/*.tar; do
            echo "Loading image: $image"
            docker load -i "$image"
          done

      - name: Create certs (without npm)
        run: |
          set -euo pipefail
          CERT_DIR="backend/certs"
          sudo chown -R runner:docker "$CERT_DIR"
          mkdir -p "$CERT_DIR"
          openssl genrsa -out "$CERT_DIR/key.pem" 2048
          openssl req -new -x509 -key "$CERT_DIR/key.pem" -out "$CERT_DIR/cert.pem" -config "$CERT_DIR/san.cnf" -extensions 'v3_req' -days 360
          ./backend/src/scripts/generateJWKS.sh

      # Add bailo NodePort
      - name: Create NodePort Config
        run: |
          cat << EOT >> infrastructure/helm/bailo/templates/nodePort.yaml
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: node-port
          spec:
            type: NodePort
            ports:
              - port: {{ .Values.nginxAuth.port }}
                targetPort: {{ .Values.nginxAuth.port }}
            selector:
               name: nginx
          EOT

      # Create local.yaml
      - name: Create local.yaml
        run: |
          cat << EOT >> infrastructure/helm/bailo/local.yaml
          ---
          # Instance Settings
          frontend:
            podSecurityContext:
              runAsUser: 1001
          backend:
            podSecurityContext:
              runAsUser: 1001
          config:
            ui:
              banner:
                enabled: "true"
                text: "BAILO TEST"
            build:
              environment: img
          # Bailo
          image:
            frontendRepository: "bailo_frontend"
            frontendTag: latest
            backendRepository: "bailo_backend"
            backendTag: latest
            artefactscanRepository: "bailo_artefactscan"
            artefactscanTag: latest
          # Used for k8s not openshift
          ingress:
            enabled: false
          route:
            enabled: false
            appPublicRoute: localhost
          mongodb:
            architecture: standalone
            auth:
              passwords:
                - MongoDBPassword
              usernames:
                - bailo_user
          EOT

      - name: Set Bailo image pull policy to Never
        run: sed -i 's/{{ .Values.image.pullPolicy }}/Never/g' infrastructure/helm/bailo/templates/bailo/bailo.deployment.yaml

      - name: HELM update dependency update
        working-directory: ./infrastructure/helm/bailo
        run: helm dependency update

      - name: HELM deploy to minikube
        working-directory: ./infrastructure/helm/bailo
        run: helm install --values ./local.yaml bailo .

      - name: Wait for all pods to be ready
        run: kubectl wait --for=condition=Ready pods -l app.kubernetes.io/instance=bailo --timeout=300s

      - name: List Certs
        run: kubectl describe secret bailo-certs

      - name: List Pods
        run: kubectl get pods

      - name: List Services
        run: kubectl get services

      - name: HELM test Bailo
        working-directory: ./infrastructure/helm/bailo
        run: helm test bailo

      - name: Test Bailo URL
        run: |
          minikube service list
          echo "---------------curl connect to bailo---------------"
          curl $(minikube service node-port --url)

      - name: Print application logs
        if: always()
        run: kubectl logs -l app.kubernetes.io/instance=bailo --tail=-1

  end_to_end:
    needs: [build_images]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        job_name: [end_to_end, integration_python, cross_instance]

    steps:
      # Clone repository
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      # Setup BuildX
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Get Bailo Docker images
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bailo_backend
          path: /tmp
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: bailo_frontend
          path: /tmp
      - name: Download artifact
        if: matrix.job_name != 'cross_instance'
        uses: actions/download-artifact@v8
        with:
          name: bailo_artefactscan
          path: /tmp

      - name: Load image
        run: |
          docker load --input /tmp/bailo_frontend.tar
          docker load --input /tmp/bailo_backend.tar
          docker image ls -a
          rm -rf /tmp/bailo_frontend.tar /tmp/bailo_backend.tar

      - name: Load artefactscan image
        if: matrix.job_name != 'cross_instance'
        run: |
          docker load --input /tmp/bailo_artefactscan.tar
          rm -rf /tmp/bailo_artefactscan.tar

      - name: Tag images for cross-instance
        if: matrix.job_name == 'cross_instance'
        run: |
          docker tag bailo_backend:latest bailo_backend:bailo_a
          docker tag bailo_backend:latest bailo_backend:bailo_b
          docker tag bailo_frontend:latest bailo_frontend:bailo_a
          docker tag bailo_frontend:latest bailo_frontend:bailo_b
          docker image ls -a

      # Create logs directory
      - run: mkdir logs

      # Install dependencies
      - run: npm ci

      # Create certs
      - run: sudo chown -R runner:docker backend/certs
      - run: npm run certs

      # Configure application
      - name: Configure Bailo
        run: |
          cat <<EOT >> backend/config/local.cjs
          module.exports = {
            mongo: {
              uri: 'mongodb://bailoadmin:bailoadmin@mongo:27017/bailo?replicaSet=rs0&authSource=admin',
            },

            minio: {
              accessKey: 'minioadmin',
              secretKey: 'minioadmin',
            },

            smtp: {
              auth: {
                user: 'mailuser',
                pass: 'mailpass',
              },
              tls: {
                rejectUnauthorized: false,
              },
            },

            logging: {
              file: {
                path: '/home/runner/work/Bailo/Bailo/logs/out.log',
              },
            },
          }
          EOT

      - name: Start services
        if: matrix.job_name != 'cross_instance'
        run: >
          docker compose -f compose.yaml -f compose.prod.yaml
          --env-file prod.env --progress=plain --parallel=-1
          up -d
          --wait --wait-timeout 60

      - name: Create shared network
        if: matrix.job_name == 'cross_instance'
        run: docker network create bailo-shared

      - name: Start cross-instance services
        if: matrix.job_name == 'cross_instance'
        run: |
          INSTANCE_NAME=bailo_a docker compose -f compose.yaml -f compose.instance-a.yaml -p bailo-a --progress=plain --parallel=-1 up -d --wait --wait-timeout 120
          INSTANCE_NAME=bailo_b docker compose -f compose.yaml -f compose.instance-b.yaml -p bailo-b --progress=plain --parallel=-1 up -d --wait --wait-timeout 120

      # e2e with Cypress
      - uses: cypress-io/github-action@v7
        if: matrix.job_name == 'end_to_end'
        with:
          wait-on: 'http://localhost:8080/api/v2/config/ui, http://localhost:8080'
          working-directory: ./frontend
          install: false
          spec: cypress/e2e/bailo/**/*

      # Cross-instance mirroring tests
      - uses: cypress-io/github-action@v7
        if: matrix.job_name == 'cross_instance'
        with:
          wait-on: 'http://localhost:8081/api/v2/config/ui, http://localhost:8082/api/v2/config/ui'
          working-directory: ./frontend
          install: false
          spec: cypress/e2e/cross-instance/**/*
        env:
          CYPRESS_BASE_URL: http://localhost:8081

      # Python integration
      - name: Set up Python
        if: matrix.job_name == 'integration_python'
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Cache python pip
        if: matrix.job_name == 'integration_python'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        if: matrix.job_name == 'integration_python'
        run: |
          python -m pip install --upgrade pip
          cd lib/python
          python -m pip install -e .[test]

      - name: Get MLFlow version from installed package
        if: matrix.job_name == 'integration_python'
        id: mlflow_version
        run: |
          version=$(python -m pip show mlflow-skinny | awk '/Version:/ {print $2}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Start MLFlow via Docker
        if: matrix.job_name == 'integration_python'
        run: docker run -d --name mlflow_server -p 5050:5000 ghcr.io/mlflow/mlflow:v${{ steps.mlflow_version.outputs.version }} mlflow server --host 0.0.0.0 --port 5000

      - name: Wait for MLFlow
        if: matrix.job_name == 'integration_python'
        env:
          MLFLOW_URL: http://localhost:5050/ajax-api/2.0/mlflow/experiments/search?max_results=1
        run: |
          for c in {1..10}; do test $(curl -s -o /dev/null -w "%{http_code}" ${MLFLOW_URL}) -eq 200 && break || sleep 3; done

      - name: Test with pytest
        if: matrix.job_name == 'integration_python'
        run: |
          cd lib/python
          python -m pytest -m integration
          python -m pytest -m mlflow
        env:
          PYTEST_RUN_PATH: "lib/python"

      # Upload all artifacts & logs
      - uses: actions/upload-artifact@v7
        if: failure() && (matrix.job_name == 'end_to_end' || matrix.job_name == 'cross_instance')
        with:
          name: cypress-screenshots-${{ matrix.job_name }}
          path: frontend/cypress/screenshots

      - name: Dump docker compose logs
        if: always() && matrix.job_name != 'cross_instance'
        run: docker compose logs > logs/stack.log

      - name: Dump cross-instance logs
        if: always() && matrix.job_name == 'cross_instance'
        run: |
          docker compose -p bailo-a logs > logs/instance-a.log 2>&1
          docker compose -p bailo-b logs > logs/instance-b.log 2>&1

      - name: Docker Compose Logs
        if: always() && matrix.job_name != 'cross_instance'
        run: cat logs/stack.log

      - name: Cross-instance logs
        if: always() && matrix.job_name == 'cross_instance'
        run: |
          cat logs/instance-a.log
          cat logs/instance-b.log

      - uses: actions/upload-artifact@v7
        if: always() && (matrix.job_name == 'end_to_end' || matrix.job_name == 'cross_instance')
        with:
          name: logs-${{ matrix.job_name }}
          path: logs
