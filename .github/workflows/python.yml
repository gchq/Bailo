name: Python Unit Test

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Restrict PR execution to files that affect this workflow to reduce CI runtime and GitHub Actions consumption
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'lib/python/**'
              - '.github/workflows/python.yml'

  python_static_checks:
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-static-${{ hashFiles('lib/python/pyproject.toml') }}-python3.14
          restore-keys: |
            ${{ runner.os }}-pip-static-python3.14

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd lib/python
          python -m pip install -e .[test]

      - name: Check formatting
        run: |
          cd lib/python
          ruff format --check .
        continue-on-error: true

      - name: Check linting
        run: |
          cd lib/python
          ruff check src/bailo
        continue-on-error: true


  python_test:
    needs: [changes, python_static_checks]
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('lib/python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd lib/python
          python -m pip install -e .[test]

      # Pytest
      - name: Run basic testing
        run: |
          cd lib/python
          python -m pytest
        env:
          PYTEST_RUN_PATH: "lib/python"

  # Gate job for branch protection: always runs so the required check is never left pending when the matrix is skipped
  python_test_result:
    if: always()
    needs: [changes, python_test]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: >-
          needs.python_test.result == 'failure'
          || (needs.changes.outputs.relevant == 'true' && needs.python_test.result != 'success')
