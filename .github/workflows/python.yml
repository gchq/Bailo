name: Python Unit Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Restrict PR execution to files that affect this workflow to reduce CI runtime and GitHub Actions consumption
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'lib/python/**'
              - '.github/workflows/python.yml'

  python_static_checks:
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: lib/python/uv.lock

      - name: Install dependencies
        working-directory: lib/python
        run: uv sync --extra mlflow --group test --locked

      - name: Check formatting
        working-directory: lib/python
        run: uv run ruff format --check .
        continue-on-error: true

      - name: Check linting
        working-directory: lib/python
        run: uv run ruff check src/bailo
        continue-on-error: true


  python_test:
    needs: [changes, python_static_checks]
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: lib/python/uv.lock

      - name: Install dependencies
        working-directory: lib/python
        run: uv sync --extra mlflow --group test --locked

      # Pytest
      - name: Run basic testing
        working-directory: lib/python
        run: uv run pytest
        env:
          PYTEST_RUN_PATH: "lib/python"

  # Gate job for branch protection: always runs so the required check is never left pending when the matrix is skipped
  python_test_result:
    if: always()
    needs: [changes, python_test]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: >-
          needs.python_test.result == 'failure'
          || (needs.changes.outputs.relevant == 'true' && needs.python_test.result != 'success')
