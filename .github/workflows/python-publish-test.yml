name: Publish Bailo Distribution to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Publish to TestPyPI.'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      files-changed-output: ${{ steps.files-changed.outputs.any_changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Check for changed init file (for new version)
      - name: Get changed init files
        id: files-changed
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47
        with:
          files: |
            lib/python/src/bailo/__init__.py

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      # Install build package
      - name: Install pypa/build
        run: python3 -m pip install build --user

      # Build Bailo distribution
      - name: Build a binary wheel and a source tarball
        run: |
          cd lib/python
          python3 -m build

      # Upload Bailo artifact
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-package-distributions
          path: lib/python/dist/

  publish-to-testpypi:
    name: Publish Bailo distribution to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/bailo

    permissions:
      id-token: write

    steps:
      #Retrieve Bailo artifact
      - name: Download all the dists
        if: needs.build.outputs.files-changed-output == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: python-package-distributions
          path: lib/python/dist/

      # Publish artifact to TestPyPI
      - name: Publish distribution to TestPyPI
        if: needs.build.outputs.files-changed-output == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: lib/python/dist/
          repository-url: https://test.pypi.org/legacy/