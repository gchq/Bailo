name: Publish Bailo Distribution to TestPyPI

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Publish to TestPyPI.'

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    outputs:
      files-changed-output: ${{ steps.files-changed.outputs.any_changed }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Check for changed init file (for new version)
      - name: Get changed init files
        id: files-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            lib/python/src/bailo/__init__.py

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: lib/python/uv.lock

      # Build Bailo distribution
      - name: Build a binary wheel and a source tarball
        working-directory: lib/python
        run: uv build

      # Upload Bailo artifact
      - name: Store the distribution packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: lib/python/dist/

  publish-to-testpypi:
    name: Publish Bailo distribution to TestPyPI
    needs:
    - build
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/bailo

    permissions:
      id-token: write

    steps:
      #Retrieve Bailo artifact
      - name: Download all the dists
        if: needs.build.outputs.files-changed-output == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: lib/python/dist/

      # Publish artifact to TestPyPI
      - name: Publish distribution to TestPyPI
        if: needs.build.outputs.files-changed-output == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: lib/python/dist/
          repository-url: https://test.pypi.org/legacy/