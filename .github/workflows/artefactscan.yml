name: ArtefactScan Python REST API Unit Test

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Restrict PR execution to files that affect this workflow to reduce CI runtime and GitHub Actions consumption
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            relevant:
              - 'lib/artefactscan_api/**'
              - '.github/workflows/artefactscan.yml'

  artefactscan_build:
    needs: changes
    if: github.ref == 'refs/heads/main' || needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd lib/artefactscan_api
          python -m pip install -r requirements-dev.txt

      - name: Run basic tests
        run: |
          cd lib/artefactscan_api
          python -m pytest
        env:
          PYTEST_RUN_PATH: "lib/artefactscan_api"

      - name: Run integration tests
        run: |
          cd lib/artefactscan_api
          python -m pytest -m integration
        env:
          PYTEST_RUN_PATH: "lib/artefactscan_api"

  # Gate job for branch protection: always runs so the required check is never left pending when the matrix is skipped
  artefactscan_build_result:
    if: always()
    needs: [changes, artefactscan_build]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: >-
          needs.artefactscan_build.result == 'failure'
          || (needs.changes.outputs.relevant == 'true' && needs.artefactscan_build.result != 'success')
