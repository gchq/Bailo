[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bailo-docs"
version = "1.0.0"
description = "Sphinx documentation for the Bailo Python client"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ipython>=9.17.0,<10",
    "myst-parser>=5.1.0,<6",
    "nbsphinx>=0.9.8,<0.10",
    "sphinx>=9.1.0,<10",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinx-rtd-theme>=3.1.0,<4",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "ruff>=0.16.5,<0.17",
]

[tool.setuptools]
py-modules = []
