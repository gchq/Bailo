[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bailo-docs"
version = "1.0.0"
description = "Sphinx documentation for the Bailo Python client"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "ipython==9.16.1",
    "myst_parser==5.1.0",
    "nbsphinx==0.9.8",
    "sphinx==9.1.0",
    "sphinx-copybutton==0.5.2",
    "sphinx-rtd-theme==3.1.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.4",
]

[tool.setuptools]
py-modules = []
