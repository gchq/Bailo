[build-system]
requires = ["flit_core >=4.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name =  "bailo"
authors = []
description = "Simplifies interacting with Bailo programmatically"
readme = "README.md"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "requests==2.34.2",
    "semantic-version==2.10.0",
    "tqdm==4.70.0"
]

[project.optional-dependencies]
mlflow = [
    "mlflow-skinny[mlserver]==3.15.1"
]
test = [
    "check-manifest==0.51",
    "pre-commit==4.6.2",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-runner==6.0.1",
    "pytest==9.1.1",
    "pytest-github-actions-annotate-failures==0.4.2",
    "requests_mock==1.12.1",
    "ruff==0.16.5",
    "shellcheck-py==0.11.0.1",
    "bailo[mlflow]"
]

[project.urls]
Documentation = "https://github.com/gchq/bailo/tree/main#readme"
Source = "https://github.com/gchq/bailo"
Tracker = "https://github.com/gchq/bailo/issues"
Changelog = "https://github.com/gchq/Bailo/blob/main/lib/python/CHANGELOG.md"

[tool.flit.module]
name = "bailo"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 100

[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
]
venv = "env310"

reportMissingImports = true
reportMissingTypeStubs = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

executionEnvironments = [
  { root = "src" }
]

[tool.pytest.ini_options]
addopts = "--cov-report xml:coverage.xml --cov src --cov-fail-under 0 --cov-append -m 'not (integration or mlflow)'"
pythonpath = [
  "src"
]
testpaths = "tests"
junit_family = "xunit2"
markers = [
    "integration: marks as integration test",
    "mlflow: marks as mlflow integration test",
]
