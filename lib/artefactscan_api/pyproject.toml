[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "bailo-artefactscan-api"
version = "4.3.1"
description = "FastAPI scanning service for Bailo artefacts (ModelScan and Trivy)"
requires-python = "==3.12.*"
dependencies = [
    "content-size-limit-asgi>=0.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141",
    "filelock>=3",
    "modelscan[tensorflow,h5py]>=0.8",
    "oras>=0.2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=9",
    "pytest-github-actions-annotate-failures>=0.4",
    "pytest-mock>=3",
]

[tool.uv.build-backend]
# Package lives at the project root rather than in `src/`
module-root = ""

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
testpaths = ["tests"]
junit_family = "xunit2"
markers = ["integration: marks as integration test"]
