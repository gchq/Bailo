[build-system]
requires = ["flit_core >=4.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "bailo-artefactscan-api"
version = "4.3.0"
description = "FastAPI scanning service for Bailo artefacts (ModelScan and Trivy)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "content-size-limit-asgi>=0.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141",
    "filelock>=3",
    "modelscan[tensorflow,h5py]>=0.8",
    "oras>=0.2",
    "pydantic-settings>=2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=9",
    "pytest-github-actions-annotate-failures>=0.4",
    "pytest-mock>=3",
    "ruff>=0.16",
]

[tool.flit.module]
name = "bailo_artefactscan_api"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
testpaths = ["tests"]
junit_family = "xunit2"
markers = ["integration: marks as integration test"]
