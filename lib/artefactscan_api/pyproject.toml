[build-system]
requires = ["flit_core >=4.0,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "bailo-artefactscan-api"
version = "4.3.0"
description = "FastAPI scanning service for Bailo artefacts (ModelScan and Trivy)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "content-size-limit-asgi>=0.1.5,<0.2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1,<0.142",
    "filelock>=3.32.3,<4",
    "modelscan[tensorflow,h5py]>=0.8.8,<0.9",
    "oras>=0.2.43,<0.3",
    "pydantic-settings>=2.15.0,<3",
    "python-multipart>=0.0.32,<0.1",
    "uvicorn>=0.52.4,<0.53",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10",
    "pytest-github-actions-annotate-failures>=0.4.2,<0.5",
    "pytest-mock>=3.15.1,<4",
    "ruff>=0.16.4,<0.17",
]

[tool.flit.module]
name = "bailo_artefactscan_api"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]
pythonpath = ["."]
testpaths = ["tests"]
junit_family = "xunit2"
markers = ["integration: marks as integration test"]
