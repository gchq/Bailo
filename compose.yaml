name: bailo

configs:
  mongod_conf:
    file: infrastructure/mongodb/mongod_docker_compose.conf
  mongod_keyfile:
    content: abcdef1234567890

services:
  mongo:
    image: mongodb/mongodb-community-server:8.3.8-ubi9@sha256:9eaebd2de3487bfc36c4f77646702f616cf7130813c62f1ffbd3fddc265aeb67
    networks:
      internal:
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=bailoadmin
      - MONGODB_INITDB_ROOT_PASSWORD=bailoadmin
      - MONGODB_INITDB_REPL_SET_HOST=mongo
      - MONGODB_INITDB_DATABASE=bailo
    volumes:
      - mongoVolume:/data/db
    configs:
      - source: mongod_conf
        target: /etc/mongod.conf
      - source: mongod_keyfile
        target: /etc/mongod.keyfile
        mode: 0400
        uid: '999'
        gid: '999'
    command:
      - '-f'
      - '/etc/mongod.conf'
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      start_period: 30s

  seaweedfs:
    image: chrislusf/seaweedfs:4.45@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5
    networks:
      - internal
    command:
      - server
      - -dir=/data
      - -master.port=9333
      - -volume.port=8080
      - -volume.max=100
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3_config.json
      - -ip.bind=0.0.0.0
    volumes:
      - seaweedfsVolume:/data
      - ./infrastructure/seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://localhost:9333/cluster/status >/dev/null && curl -fsS http://localhost:8333/ >/dev/null 2>&1
          || curl -so /dev/null -w "%{http_code}" http://localhost:8333/ | grep -q 403',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginxinc/nginx-unprivileged:1.31.2-alpine3.23-slim@sha256:eed3e4c2f3f9285e80610238e0b18fe1bf311c50559434db1969b1cfabd5518b
    networks:
      default:
      internal:
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  registry:
    # https://github.com/distribution/distribution/pull/4898
    image: distribution/distribution@sha256:1eda63c5b5ba2c53b8b7e7071d7e67ca42e93c4ea5d9015c2b8160eb09a95d61
    networks:
      internal:
    environment:
      REGISTRY_HTTP_TLS_CERTIFICATE: /certs/cert.pem
      REGISTRY_HTTP_TLS_KEY: /certs/key.pem

      REGISTRY_STORAGE_S3_ACCESSKEY: bailoadmin
      REGISTRY_STORAGE_S3_SECRETKEY: bailoadmin

      REGISTRY_AUTH: token
      REGISTRY_AUTH_TOKEN_REALM: http://backend:3001/api/v1/registry_auth
      REGISTRY_AUTH_TOKEN_SERVICE: RegistryAuth
      REGISTRY_AUTH_TOKEN_ISSUER: RegistryIssuer
      REGISTRY_AUTH_TOKEN_JWKS: /certs/jwks.json
      REGISTRY_AUTH_TOKEN_ROOTCERTBUNDLE: /certs/cert.pem
    volumes:
      - ./backend/config/registry.conf:/etc/distribution/config.yml
      - ./backend/certs:/certs:ro

  frontend:
    networks:
      internal:
    image: bailo_frontend:${INSTANCE_NAME}
    build:
      context: ./frontend/
      target: prod
    depends_on:
      - backend

  backend:
    networks:
      internal:
    image: bailo_backend:${INSTANCE_NAME}
    build:
      context: ./backend/
      target: prod
      additional_contexts:
        python: ./lib/python
    volumes:
      - ./backend/certs:/certs:ro
      - ./backend/certs:/usr/local/share/ca-certificates:ro
      - ./backend/config:/app/config
    depends_on:
      registry:
        condition: service_started
      seaweedfs:
        condition: service_healthy
      mongo:
        condition: service_started
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    environment:
      - NODE_CONFIG_ENV=${INSTANCE_NAME}_docker_compose

volumes:
  seaweedfsVolume:
    name: ${INSTANCE_NAME}_seaweedfsVolume
  mongoVolume:
    name: ${INSTANCE_NAME}_mongoVolume

networks:
  default:
    name: ${INSTANCE_NAME}_default
  internal:
    name: ${INSTANCE_NAME}_internal
