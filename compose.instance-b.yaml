services:
  nginx:
    ports:
      - '8082:8080'

  backend:
    environment:
      - NODE_CONFIG_ENV=prod_docker_compose
    networks:
      - default
      - internal
      # allow communicating with A's S3 store
      - bailo-shared

  minio:
    ports:
      - '9100:9000'
      - '9101:9001'

  registry:
    ports:
      - '5001:5000'

  mailcrab:
    networks:
      default:
      internal:
    ports:
      - 1080:1080
      - 1025:1025
    image: marlonb/mailcrab:v1.9.0@sha256:fbe35c063cb4c8c169e32f4d91e09ee44459843a005a567cfd3dc9876779e194

networks:
  default:
    name: bailo-b_default

  internal:
    name: bailo-b_internal

  bailo-shared:
    external: true
